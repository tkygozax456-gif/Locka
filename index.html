<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOCKA - الصفحة الرئيسية</title>
    <!-- خط Cairo المعتمد بالتطبيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- إطار جوال محاكي للشاشة -->
    <div class="phone-screen">
        
        <!-- شريط الحالة (Status Bar) -->
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- المحتوى الداخلي للشاشة -->
        <div class="screen-body">
            
            <!-- الترحيب -->
            <div class="welcome-section">
                <h2>مرحباً، سارة</h2>
                <p>ماذا تريدين أن تفعلي اليوم؟</p>
            </div>

            <!-- مربع البحث -->
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="ابحث عن لوكر أو مبنى...">
            </div>

            <!-- الزران الأوسطان (حجز لوكر / عرض الخريطة) -->
            <div class="actions-grid">
                <div class="action-btn">
                    <div class="icon-wrapper">
                        <i class="fa-regular fa-calendar-check"></i>
                    </div>
                    <span>حجز لوكر</span>
                </div>
                <div class="action-btn">
                    <div class="icon-wrapper">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </div>
                    <span>عرض الخريطة</span>
                </div>
            </div>

            <!-- قسم حجوزاتي القادمة -->
            <div class="section-header">
                <h3>حجوزاتي القادمة</h3>
                <button class="btn-see-all">عرض الكل</button>
            </div>

            <!-- بطاقة تفاصيل الحجز -->
            <div class="booking-card">
                <div class="card-row">
                    <span class="label">المبنى:</span>
                    <span class="value">كلية الحاسب</span>
                </div>
                <div class="card-row">
                    <span class="label">اللوكر:</span>
                    <span class="value locker-badge">12</span>
                </div>
                <div class="card-row detail-row">
                    <i class="fa-regular fa-clock"></i>
                    <span>من 10:00 ص إلى 12:00 م</span>
                </div>
                <div class="card-row detail-row">
                    <i class="fa-regular fa-calendar"></i>
                    <span>2025/08/25</span>
                </div>
            </div>

        </div>

        <!-- شريط التنقل السفلي (Bottom Navigation) -->
        <div class="bottom-nav">
            <div class="nav-tab active">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </div>
            <div class="nav-tab">
                <i class="fa-regular fa-calendar-days"></i>
                <span>الحجوزات</span>
            </div>
            <div class="nav-tab">
                <i class="fa-regular fa-bell"></i>
                <span>التنبيهات</span>
            </div>
            <div class="nav-tab">
                <i class="fa-regular fa-user"></i>
                <span>الملف الشخصي</span>
            </div>
        </div>

    </div>

</body>
</html>
