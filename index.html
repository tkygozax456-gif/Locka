<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سارة - الحجز</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f8f5f2;
      color: #333;
    }

    .container {
      width: 90%;
      max-width: 500px;
      margin: 40px auto;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .profile {
      text-align: center;
      margin-bottom: 25px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .description {
      color: #777;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    .info {
      background: #faf7f5;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .info p {
      margin: 8px 0;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      background: white;
    }

    .book-btn {
      width: 100%;
      border: none;
      background: #b88b7d;
      color: white;
      padding: 15px;
      border-radius: 14px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
    }

    .book-btn:hover {
      background: #9f7467;
    }

    #message {
      text-align: center;
      margin-top: 18px;
      color: #5d8a70;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="profile">
        <div class="profile-img"></div>

        <h1>سارة</h1>

        <p class="description">
          أهلاً بك في صفحة سارة 🌷
          يمكنك اختيار الموعد المناسب لك وإتمام الحجز بسهولة.
        </p>
      </div>

      <div class="info">
        <p>📍 الموقع: بريدة</p>
        <p>⭐ التقييم: 4.9</p>
        <p>💼 الخدمة: حجز موعد</p>
      </div>

      <h2>احجزي موعدك</h2>

      <form id="bookingForm">

        <label for="name">الاسم</label>
        <input
          type="text"
          id="name"
          placeholder="اكتبي اسمك"
          required
        >

        <label for="date">التاريخ</label>
        <input
          type="date"
          id="date"
          required
        >

        <label for="time">الوقت</label>
        <select id="time" required>
          <option value="">اختاري الوقت</option>
          <option>4:00 مساءً</option>
          <option>5:00 مساءً</option>
          <option>6:00 مساءً</option>
          <option>7:00 مساءً</option>
          <option>8:00 مساءً</option>
        </select>

        <button class="book-btn" type="submit">
          تأكيد الحجز
        </button>

      </form>

      <p id="message"></p>

    </div>

  </div>

  <script>
    document.getElementById("bookingForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value;

      document.getElementById("message").textContent =
        "تم تأكيد حجزك يا " + name + " 🤍";
    });
  </script>

</body>
</html>
