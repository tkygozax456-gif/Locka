<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الحجز</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <header class="header">
        <a href="index.html" class="back">‹</a>
        <h1>تفاصيل الحجز</h1>
    </header>
    <main class="content">
        <div class="locker-info-card">
            <div class="locker-icon">
                🔒
            </div>
            <div>
                <h2>
                    اللوكر رقم
                    <span id="lockerNumber">-</span>
                </h2>
                <p>كلية الحاسب</p>
                <p>الدور الأول</p>
            </div>
        </div>
        <h3 class="section-title">
            تفاصيل الحجز
        </h3>
        <div class="booking-form">
            <div class="form-group">
                <label for="startDate">
                    تاريخ البداية
                </label>
                <input
                    type="date"
                    id="startDate"
                    required>
            </div>
            <div class="form-group">
                <label for="startTime">
                    وقت البداية
                </label>
                <input
                    type="time"
                    id="startTime"
                    required>
            </div>
            <div class="form-group">
                <label for="endDate">
                    تاريخ النهاية
                </label>
                <input
                    type="date"
                    id="endDate"
                    required>
                <small>
                    أقصى مدة للحجز شهر واحد.
                </small>
            </div>
            <div class="form-group">
                <label for="endTime">
                    وقت النهاية
                </label>
                <input
                    type="time"
                    id="endTime"
                    required>
            </div>
        </div>
        <div class="price-card">
            <span>
                مدة الحجز
            </span>
            <strong id="durationText">
                —
            </strong>
        </div>
        <button
            type="button"
            class="main-button confirm"
            id="confirmButton">
            تأكيد الحجز
        </button>
    </main>
    <nav class="bottom-nav">
        <a href="index.html"
           class="nav-item">
            <span>⌂</span>
            الرئيسية
        </a>
        <a href="#"
           class="nav-item active">
            <span>▣</span>
            حجوزاتي
        </a>
        <a href="#"
           class="nav-item">
            <span>♧</span>
            التنبيهات
        </a>
        <a href="#"
           class="nav-item">
            <span>♙</span>
            حسابي
        </a>
    </nav>
</div>
<script>
/* اللوكر الذي اختاره المستخدم */
const selectedLocker =
    localStorage.getItem("selectedLocker");
const lockerNumber =
    document.getElementById("lockerNumber");
if (selectedLocker) {
    lockerNumber.textContent =
        selectedLocker;
} else {
    lockerNumber.textContent =
        "غير محدد";
}
/* عناصر التاريخ والوقت */
const startDate =
    document.getElementById("startDate");
const endDate =
    document.getElementById("endDate");
const startTime =
    document.getElementById("startTime");
const endTime =
    document.getElementById("endTime");
const durationText =
    document.getElementById("durationText");
/* تاريخ اليوم */
const today =
    new Date();
function formatDate(date) {
    const year =
        date.getFullYear();
    const month =
        String(date.getMonth() + 1)
        .padStart(2, "0");
    const day =
        String(date.getDate())
        .padStart(2, "0");
    return year + "-" + month + "-" + day;
}
/* إضافة شهر */
function addOneMonth(dateString) {
    const date =
        new Date(dateString + "T00:00:00");
    date.setMonth(
        date.getMonth() + 1
    );
    return formatDate(date);
}
/* تاريخ البداية الافتراضي */
startDate.min =
    formatDate(today);
startDate.value =
    formatDate(today);
/* الأوقات */
startTime.value =
    "08:00";
endTime.value =
    "09:00";
/* التحكم بتاريخ النهاية */
function updateEndDate() {
    if (!startDate.value) {
        return;
    }
    endDate.min =
        startDate.value;
    endDate.max =
        addOneMonth(startDate.value);
    if (
        !endDate.value ||
        endDate.value < endDate.min ||
        endDate.value > endDate.max
    ) {
        endDate.value =
            startDate.value;
    }
    calculateDuration();
}
/* حساب مدة الحجز */
function calculateDuration() {
    if (
        !startDate.value ||
        !endDate.value
    ) {
        durationText.textContent =
            "—";
        return;
    }
    const start =
        new Date(
            startDate.value +
            "T" +
            startTime.value
        );
    const end =
        new Date(
            endDate.value +
            "T" +
            endTime.value
        );
    const difference =
        end - start;
    if (difference <= 0) {
        durationText.textContent =
            "تحققي من التاريخ والوقت";
        return;
    }
    const totalHours =
        Math.round(
            difference / 3600000
        );
    const days =
        Math.floor(
            totalHours / 24
        );
    const hours =
        totalHours % 24;
    if (days > 0 && hours > 0) {
        durationText.textContent =
            days +
            " يوم و " +
            hours +
            " ساعة";
    }
    else if (days > 0) {
        durationText.textContent =
            days + " يوم";
    }
    else {
        durationText.textContent =
            hours + " ساعة";
    }
}
/* عند تغيير تاريخ البداية */
startDate.addEventListener(
    "change",
    updateEndDate
);
/* عند تغيير النهاية */
endDate.addEventListener(
    "change",
    calculateDuration
);
/* عند تغيير الوقت */
startTime.addEventListener(
    "change",
    calculateDuration
);
endTime.addEventListener(
    "change",
    calculateDuration
);
/* تشغيل أولي */
updateEndDate();
/* زر تأكيد الحجز */
document
    .getElementById("confirmButton")
    .addEventListener("click", function() {
        if (!selectedLocker) {
            alert(
                "فضلاً ارجعي للصفحة الرئيسية واختاري لوكر متاح أولاً."
            );
            return;
        }
        if (
            !startDate.value ||
            !endDate.value ||
            !startTime.value ||
            !endTime.value
        ) {
            alert(
                "فضلاً أدخلي جميع تفاصيل الحجز."
            );
            return;
        }
        /* التأكد أن المدة لا تتجاوز شهر */
        const maximumDate =
            addOneMonth(
                startDate.value
            );
        if (
            endDate.value >
            maximumDate
        ) {
            alert(
                "أقصى مدة للحجز هي شهر واحد."
            );
            return;
        }
        /* التأكد من أن النهاية بعد البداية */
        const start =
            new Date(
                startDate.value +
                "T" +
                startTime.value
            );
        const end =
            new Date(
                endDate.value +
                "T" +
                endTime.value
            );
        if (end <= start) {
            alert(
                "وقت النهاية يجب أن يكون بعد وقت البداية."
            );
            return;
        }
        alert(
            "✅ تم تأكيد الحجز بنجاح!\n\n" +
            "تم حجز اللوكر رقم " +
            selectedLocker +
            "."
        );
    });
</script>
</body>
</html>
