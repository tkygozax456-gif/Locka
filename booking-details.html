<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الحجز</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">

            <a href="lockers.html" class="back">‹</a>

            <h1>تفاصيل الحجز</h1>

        </header>


        <main class="content">

            <!-- Locker -->
            <div class="locker-info-card">

                <div class="locker-icon">
                    🔒
                </div>

                <div>
                    <h2>اللوكر رقم 12</h2>

                    <p>كلية الحاسب</p>

                    <p>الدور الأول</p>
                </div>

            </div>


            <!-- Booking Details -->
            <h3 class="section-title">
                تفاصيل الحجز
            </h3>


            <div class="details-card">

                <div class="detail-row">

                    <span>تاريخ البداية</span>

                    <strong>25 / 09 / 2026</strong>

                </div>


                <div class="detail-row">

                    <span>وقت البداية</span>

                    <strong>10:00 ص</strong>

                </div>


                <div class="detail-row">

                    <span>تاريخ النهاية</span>

                    <strong>25 / 09 / 2026</strong>

                </div>


                <div class="detail-row">

                    <span>وقت النهاية</span>

                    <strong>12:00 م</strong>

                </div>

            </div>


            <!-- Duration -->
            <div class="form-group">

                <label>مدة الحجز</label>

                <select>

                    <option>ساعة</option>

                    <option>ساعتان</option>

                    <option>3 ساعات</option>

                    <option>يوم كامل</option>

                </select>

            </div>


            <!-- Price -->
            <div class="price-card">

                <span>المبلغ الإجمالي</span>

                <strong>10 ريال</strong>

            </div>


            <!-- Confirm -->
            <a href="#" class="main-button confirm">
                تأكيد الحجز
            </a>

        </main>


        <!-- Bottom Navigation -->
        <nav class="bottom-nav">

            <a href="lockers.html" class="nav-item">
                <span>⌂</span>
                الرئيسية
            </a>

            <a href="#" class="nav-item active">
                <span>▣</span>
                حجوزاتي
            </a>

            <a href="#" class="nav-item">
                <span>♧</span>
                التنبيهات
            </a>

            <a href="#" class="nav-item">
                <span>♙</span>
                حسابي
            </a>

        </nav>

    </div>

</body>
</html>
