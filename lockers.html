<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اللوكر المتاحة</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <a href="#" class="back">‹</a>
            <h1>اللوكر المتاحة</h1>
        </header>

        <!-- Content -->
        <main class="content">

            <div class="location-box">
                <h2>كلية الحاسب</h2>
                <p>الدور الأول - اختر اللوكر المناسب لك</p>
            </div>

            <!-- الحالات -->
            <div class="legend">

                <div class="legend-item">
                    <span class="dot available-dot"></span>
                    متاح
                </div>

                <div class="legend-item">
                    <span class="dot reserved-dot"></span>
                    محجوز
                </div>

            </div>

            <!-- Lockers -->
            <div class="lockers">

                <div class="locker available">1</div>
                <div class="locker available">2</div>
                <div class="locker available">3</div>
                <div class="locker reserved">4</div>
                <div class="locker reserved">5</div>

                <div class="locker available">6</div>
                <div class="locker available">7</div>
                <div class="locker reserved">8</div>
                <div class="locker available">9</div>
                <div class="locker available">10</div>

                <div class="locker available">11</div>
                <div class="locker available">12</div>
                <div class="locker reserved">13</div>
                <div class="locker reserved">14</div>
                <div class="locker available">15</div>

                <div class="locker available">16</div>
                <div class="locker reserved">17</div>
                <div class="locker available">18</div>
                <div class="locker available">19</div>
                <div class="locker reserved">20</div>

                <div class="locker available">21</div>
                <div class="locker available">22</div>
                <div class="locker reserved">23</div>
                <div class="locker available">24</div>
                <div class="locker available">25</div>

            </div>

            <!-- اختيار اللوكر -->
            <div class="booking-card">

                <h3>هل تريد حجز لوكر؟</h3>

                <p>
                    اختر رقم اللوكر المتاح ثم انتقل إلى تفاصيل الحجز.
                </p>

                <a href="booking-details.html" class="main-button">
                    الانتقال إلى تفاصيل الحجز
                </a>

            </div>

        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">

            <a href="#" class="nav-item active">
                <span>⌂</span>
                الرئيسية
            </a>

            <a href="#" class="nav-item">
                <span>▣</span>
                حجوزاتي
            </a>

            <a href="#" class="nav-item">
                <span>♧</span>
                التنبيهات
            </a>

            <a href="#" class="nav-item">
                <span>♙</span>
                حسابي
            </a>

        </nav>

    </div>

</body>
</html>
