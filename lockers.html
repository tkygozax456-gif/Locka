<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOCKA - الصفحة الرئيسية</title>
    
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* الألوان المحددة للتطبيق */
        :root {
            --primary: #2E5B9A;      /* الأزرق الرئيسي */
            --secondary: #5B8FD9;    /* الأزرق المتوسط */
            --accent: #A7C8F0;       /* الأزرق الفاتح */
            --bg-light: #F5F8FF;     /* خلفية الصفحة */
            --gray-light: #E5E7EB;   /* الحدود */
            --text-dark: #1F2937;    /* النصوص الغامقة */
            --text-muted: #6B7280;   /* النصوص الفرعية */
            --white: #FFFFFF;        /* الأبيض */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* إطار الجوال المتجاوب */
        .mobile-frame {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
        }

        /* شريط الحالة العلوي */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px 5px 20px;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .status-icons i {
            margin-right: 4px;
        }

        /* المحتوى الرئيسي */
        .content {
            flex: 1;
            padding: 15px 20px;
            overflow-y: auto;
        }

        /* قسم الترحيب */
        .user-header {
            margin-bottom: 18px;
        }

        .user-header h1 {
            color: var(--primary);
            font-size: 22px;
            font-weight: 700;
        }

        .user-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 2px;
        }

        /* مربع البحث */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border-radius: 12px;
            border: 1px solid var(--gray-light);
            background-color: var(--white);
            font-size: 13px;
            color: var(--text-dark);
            outline: none;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* بطاقات الأزرار السريعة */
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .action-card {
            background: var(--white);
            border: 1px solid var(--gray-light);
            border-radius: 16px;
            padding: 18px 10px;
            text-align: center;
            text-decoration: none;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .action-card .icon-box {
            width: 44px;
            height: 44px;
            background-color: var(--bg-light);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 20px;
        }

        .action-card span {
            font-size: 13px;
            font-weight: 600;
        }

        /* قسم الحجوزات */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-header h2 {
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 700;
        }

        .section-header a {
            color: var(--secondary);
            font-size: 12px;
            text-decoration: none;
        }

        /* بطاقة تفاصيل الحجز */
        .booking-card {
            background: var(--white);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--gray-light);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .booking-info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-dark);
        }

        .booking-info-item i {
            color: var(--primary);
            width: 18px;
            text-align: center;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            background-color: var(--white);
            border-top: 1px solid var(--gray-light);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0 15px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 700;
        }

        .nav-item i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="mobile-frame">
        <!-- شريط الحالة -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="content">
            <div class="user-header">
                <h1>مرحباً، سارة</h1>
                <p>ماذا تريدين أن تفعلي اليوم؟</p>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="ابحث عن لوكر أو مبنى...">
            </div>

            <div class="quick-actions">
                <div class="action-card">
                    <div class="icon-box">
                        <i class="fa-regular fa-calendar-plus"></i>
                    </div>
                    <span>حجز لوكر</span>
                </div>
                <div class="action-card">
                    <div class="icon-box">
                        <i class="fa-solid fa-map-location-dot"></i>
                    </div>
                    <span>عرض الخريطة</span>
                </div>
            </div>

            <div class="section-header">
                <h2>حجوزاتي القادمة</h2>
                <a href="#">عرض الكل</a>
            </div>

            <div class="booking-card">
                <div class="booking-info-item">
                    <i class="fa-solid fa-building"></i>
                    <span><strong>المبنى:</strong> كلية الحاسب</span>
                </div>
                <div class="booking-info-item">
                    <i class="fa-solid fa-key"></i>
                    <span><strong>اللوكر:</strong> 12</span>
                </div>
                <div class="booking-info-item">
                    <i class="fa-regular fa-clock"></i>
                    <span>من 10:00 ص إلى 12:00 م</span>
                </div>
                <div class="booking-info-item">
                    <i class="fa-regular fa-calendar"></i>
                    <span>2025/08/25</span>
                </div>
            </div>
        </div>

        <!-- شريط التنقل السفلي -->
        <div class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-regular fa-calendar-check"></i>
                <span>الحجوزات</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-regular fa-bell"></i>
                <span>التنبيهات</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-regular fa-user"></i>
                <span>الملف الشخصي</span>
            </a>
        </div>
    </div>

</body>
</html>
